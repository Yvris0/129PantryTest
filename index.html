<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Drinks Tab</title>
<style>
:root{--bg:#fafaf7;--fg:#1d1d1b;--mut:#6b6b66;--card:#fff;--bd:#e3e3dc;--ac:#0f6e56;--acf:#fff;--warn:#b3261e;color-scheme:light dark}
@media(prefers-color-scheme:dark){:root{--bg:#171716;--fg:#ecece6;--mut:#9a9a92;--card:#222221;--bd:#3a3a37;--ac:#4fbf9f;--acf:#10231d;--warn:#ff8a80}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.45 system-ui,sans-serif}
main{max-width:720px;margin:0 auto;padding:16px}h1{font-size:20px;margin:0 0 12px}h2{font-size:16px;margin:20px 0 8px}
button,input,select{font:inherit;color:inherit}
button{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:9px 14px;cursor:pointer}
button.on,button.pri{background:var(--ac);color:var(--acf);border-color:var(--ac)}button:disabled{opacity:.45;cursor:not-allowed}
input,select{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:9px 10px;min-width:0}
nav{display:flex;gap:6px;margin-bottom:14px}.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
.bill{border-color:var(--ac)}.big{font-size:28px;font-weight:650}.mut{color:var(--mut);font-size:14px}.warn{color:var(--warn)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.drink{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:14px;text-align:left}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:6px 0}
.scroll{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--bd);white-space:nowrap}td.n,th.n{text-align:right}

/* Responsive layout improvements */
html {
  -webkit-text-size-adjust: 100%;
  text-size-adjust: 100%;
}
body {
  min-width: 320px;
  overflow-x: hidden;
}
main {
  width: 100%;
}
button, input, select {
  min-height: 42px;
}
button {
  touch-action: manipulation;
}
input, select {
  max-width: 100%;
}
nav button {
  flex: 1 1 0;
  min-width: 0;
}
.grid {
  grid-template-columns: repeat(auto-fit, minmax(min(100%, 150px), 1fr));
}
.scroll {
  max-width: 100%;
  -webkit-overflow-scrolling: touch;
  overscroll-behavior-x: contain;
}
.scroll table {
  min-width: max-content;
}
.card {
  min-width: 0;
}
.row > input,
.row > select {
  min-width: 0;
}
img {
  max-width: 100%;
  height: auto;
}

@media (max-width: 600px) {
  main {
    padding: 12px;
  }
  h1 {
    font-size: 21px;
    margin-bottom: 14px;
  }
  h2 {
    margin-top: 18px;
  }
  nav {
    position: sticky;
    top: 0;
    z-index: 5;
    padding: 8px 0;
    margin: -4px 0 10px;
    background: var(--bg);
  }
  nav button {
    padding: 11px 10px;
  }
  .card {
    padding: 12px;
    border-radius: 12px;
  }
  .grid {
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 8px;
  }
  .drink {
    padding: 12px 10px;
    gap: 5px;
  }
  .drink .row {
    width: 100%;
    justify-content: space-between;
    flex-wrap: nowrap;
    margin-top: 7px;
  }
  .drink .row button {
    flex: 1;
    min-width: 42px;
    padding: 8px 10px;
    font-size: 18px;
  }
  .row {
    gap: 8px;
  }
  .row > input,
  .row > select {
    flex: 1 1 100%;
    width: 100%;
  }
  .row > button {
    flex: 1 1 auto;
  }
  .big {
    font-size: 25px;
  }
  .scroll {
    margin-left: -2px;
    margin-right: -2px;
    width: calc(100% + 4px);
  }
  .scroll table {
    font-size: 13px;
  }
  th, td {
    padding: 9px 7px;
  }
  /* Keep the account controls usable without forcing a single long row. */
  #buy > .card:first-child .row {
    align-items: stretch;
  }
  #buy > .card:first-child .row > span {
    flex-basis: 100%;
  }
  #buy > .card:first-child .row > button {
    flex: 1 1 calc(50% - 4px);
  }
  /* Admin forms wrap cleanly on narrow screens. */
  #adm .row {
    flex-wrap: wrap;
  }
  #adm .row > input,
  #adm .row > select {
    flex: 1 1 100%;
    width: 100% !important;
  }
  #adm .row > button {
    flex: 1 1 auto;
  }
  #adm .scroll {
    border-radius: 10px;
  }
}

@media (max-width: 380px) {
  main {
    padding: 10px;
  }
  .grid {
    gap: 7px;
  }
  .drink {
    padding: 10px 8px;
  }
  .drink b {
    overflow-wrap: anywhere;
  }
  .card {
    padding: 10px;
  }
  .big {
    font-size: 23px;
  }
}

@media (prefers-reduced-motion: no-preference) {
  button {
    transition: background-color .15s ease, border-color .15s ease, opacity .15s ease;
  }
}

</style></head>
<body><main><h1>Drinks Tab</h1>
<nav><button id="t-buy" class="on">Log a drink</button><button id="t-adm">Admin</button></nav>
<div id="buy"></div><div id="adm" hidden></div><p id="msg" class="mut"></p></main>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const money = n => '$' + Number(n).toFixed(2);
const API_URL = 'https://script.google.com/macros/s/AKfycbzHQ8F1B7tAg0NLOELdpCqrUyzkCS6wKvcHKSjx0bWoezq02HAIBmMLaJj6xyxC2yT7/exec';   // the Web app URL ending in /exec
const run = async (fn, ...a) => {
  if (API_URL.indexOf('PASTE') === 0) throw new Error('Set API_URL at the top of the script in index.html');
  let r;
  try {
    r = await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ fn: fn, args: a }) });
    r = await r.json();
  } catch (e) { throw new Error('Cannot reach the server. Check your connection.'); }
  if (!r.ok) throw new Error(r.error);
  return r.v;
};
let hist = null, atgUrl = null, tgUrl = null, dueDismissed = false, cart = {}, pay = { on: false }, showPay = false, me = null, S = null, pin = null, month = new Date().toISOString().slice(0, 7);
let tok = null;
try { tok = localStorage.getItem('tok') || null; } catch (e) {}

function flash(t, ms) { $('msg').textContent = t; clearTimeout(flash.t); flash.t = setTimeout(() => $('msg').textContent = '', ms || 3000); }
async function tryRun(fn, ...a) { try { return { ok: true, v: await run(fn, ...a) }; } catch (e) { flash(e && e.message ? e.message.replace(/^Error:\s*/, '') : 'Something went wrong'); return { ok: false }; } }
async function safe(p) { try { return await p; } catch (e) { flash(e && e.message ? e.message.replace(/^Error:\s*/, '') : 'Something went wrong'); } }

function showTab(t) {
  $('buy').hidden = t !== 'buy'; $('adm').hidden = t !== 'adm';
  $('t-buy').className = t === 'buy' ? 'on' : ''; $('t-adm').className = t === 'adm' ? 'on' : '';
  if (t === 'adm') adminLoad();
}
$('t-buy').onclick = () => showTab('buy');
$('t-adm').onclick = () => showTab('adm');

async function loadBuy() {
  if (!pay.checked) { const p = await safe(run('payInfo')); if (p) { pay = p; pay.checked = true; } }
  if (!tok) { drawLogin(); return; }
  const t = await tryRun('myState', tok);
  if (t.ok) { S = t.v; me = S.name; drawBuy(); }
  else { tok = null; try { localStorage.removeItem('tok'); } catch (x) {} drawLogin(); }
}
function payPanel() {
  if (!showPay || !(S.owed > 0)) return '';
  return `<div class="card bill"><h2 style="margin-top:0">Pay ${money(S.owed)}</h2>` +
    (pay.qr ? `<img src="${pay.qr}" alt="Payment code" style="max-width:240px;width:100%;display:block;margin:8px 0">` : '') +
    (pay.note ? `<p style="white-space:pre-line">${esc(pay.note)}</p>` : '') + `<p class="mut">Reference: ${esc(me)}</p>` +
    '<div class="row"><button class="pri" id="paid">I\'ve paid</button><button id="later">Pay later</button></div></div>';
}
function drawLogin(email) {
  $('buy').innerHTML = `<div class="card"><h2 style="margin-top:0">Sign in</h2><div class="row"><input id="em" type="email" placeholder="Email" value="${esc(email || '')}"></div><div class="row"><input id="pn" type="password" inputmode="numeric" maxlength="6" placeholder="PIN (4-6 digits)"><button type="button" id="pnt">Show</button></div><div class="row"><input id="nm" placeholder="Name (first time only)"></div><div class="row"><button class="pri" id="go">Sign in</button></div><p class="mut">First time? Add your name and choose a PIN. Forgot your PIN? Ask the admin to reset it.</p></div>`;
  const go = async () => {
    const r = await tryRun('signIn', $('em').value.trim(), $('pn').value, $('nm').value);
    if (r.ok) { tok = r.v; try { localStorage.setItem('tok', tok); } catch (x) {} loadBuy(); }
  };
  $('go').onclick = go;
  $('pnt').onclick = () => { const i = $('pn'), show = i.type === 'password'; i.type = show ? 'text' : 'password'; $('pnt').textContent = show ? 'Hide' : 'Show'; i.focus(); };
  $('pn').onkeydown = e => { if (e.key === 'Enter') go(); };
}
const sigOf = () => `${S.owed}|${S.pending}|${S.count}|${S.total}`;
const histOpen = () => hist && hist.user === S.name && hist.sig === sigOf();
function histCard() {
  if (!histOpen()) return '';
  return `<div class="card scroll"><div class="mut">Paid ${money(hist.paid)} · Reported ${money(hist.pending)} · Unpaid ${money(hist.owed)}</div><table><tr><th>Date</th><th>Items</th><th class="n">Total</th><th>Status</th></tr>` +
    (hist.list.map(g => `<tr><td>${new Date(g.ts).toLocaleDateString()}</td><td style="white-space:normal">${esc(g.text)}</td><td class="n">${money(g.total)}</td><td>${({ '': 'Unpaid', R: 'Reported', Y: 'Paid' })[g.st]}</td></tr>`).join('') || '<tr><td colspan="4" class="mut">Nothing yet</td></tr>') + '</table></div>';
}
function remindCard() {
  const p = S.prefs;
  if (!p || !p.botReady) return '';
  const sel = (v, t) => `<option value="${v}" ${p.notify === v ? 'selected' : ''} ${v !== 'email' && !p.connected ? 'disabled' : ''}>${t}</option>`;
  let h = '<h2>Reminders</h2><div class="card"><div class="row"><label>Send reminders by</label><select id="nt">' + sel('email', 'Email') + sel('telegram', 'Telegram') + sel('both', 'Both') + '</select></div>';
  if (p.connected) h += '<div class="row"><span class="mut" style="flex:1">Telegram connected</span><button id="tgd">Disconnect</button></div>';
  else if (tgUrl) h += `<p><a href="${esc(tgUrl)}" target="_blank" rel="noopener">Open Telegram and press Start</a> <span class="mut">(waiting…)</span></p>`;
  else h += '<div class="row"><button class="pri" id="tgc">Connect Telegram</button></div>';
  return h + '</div>';
}
async function pollTg() {
  for (let i = 0; i < 40 && tgUrl && tok; i++) {
    await new Promise(r => setTimeout(r, 3000));
    const r = await safe(run('tgCheck', tok));
    if (r && r.prefs.connected) { S = r; tgUrl = null; drawBuy(); flash('Telegram connected'); return; }
  }
  tgUrl = null; if (tok && S) drawBuy();
}
function duePopup() {
  if (!(S.prevOwed > 0) || dueDismissed) return '';
  const months = Object.keys(S.byMonth).filter(k => k < S.month).sort().map(k => `<div class="mut">${k}: ${money(S.byMonth[k])}</div>`).join('');
  return `<div style="position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:10"><div class="card" style="max-width:420px;width:100%;margin:0;max-height:90vh;overflow:auto"><h2 style="margin-top:0">Payment due</h2><div class="big warn">${money(S.prevOwed)}</div>${months}` +
    (pay.qr ? `<img src="${pay.qr}" alt="Payment code" style="max-width:240px;width:100%;display:block;margin:8px 0">` : '') +
    (pay.note ? `<p style="white-space:pre-line">${esc(pay.note)}</p>` : '') + `<p class="mut">Reference: ${esc(S.name)}</p><div class="row"><button class="pri" id="duepaid">I've paid</button><button id="duelater">Remind me later</button></div></div></div>`;
}
function drawBuy() {
  const st = S.state;
  st.drinks.forEach(d => { if ((cart[d.name] || 0) > d.left) cart[d.name] = Math.max(0, d.left); if (!cart[d.name]) delete cart[d.name]; });
  let h = `<div class="card"><div class="row"><span style="flex:1">Signed in as <b>${esc(S.name)}</b></span><button id="hist">${histOpen() ? 'Hide history' : 'My history'}</button><button id="so">Sign out</button></div></div>`;
  if (me) h += payPanel() + `<div class="card bill"><div class="mut">Balance to pay</div><div class="big ${S.owed > 0 ? 'warn' : ''}">${money(S.owed)}</div>` +
    (S.owed > 0 ? Object.keys(S.byMonth).sort().map(k => `<div class="mut">${k}: ${money(S.byMonth[k])}</div>`).join('') : '<div class="mut">All settled. Nothing to pay.</div>') +
    (S.prevOwed > 0 ? '<div class="row"><button class="pri" id="duebtn">Pay previous balance</button></div>' : '') +
    (S.owed > 0 && pay.on ? '<div class="row"><button class="pri" id="pay">Pay now</button></div>' : '') +
    (S.pending > 0 ? `<div class="mut">${money(S.pending)} reported paid, awaiting admin confirmation</div>` : '') +
    `<div class="mut" style="margin-top:8px">This month (${S.month}): ${money(S.total)} · ${S.count} drink(s)${pay.on ? '' : ' · pay at end of month'}</div></div>`;
  if (S.last && S.last.undo && Date.now() - S.last.ts < 600000)
    h += `<div class="card"><div class="mut">Just submitted</div><div>${esc(S.last.text)} · ${money(S.last.total)}</div><div class="row"><button id="undo">Made a mistake? Undo</button></div></div>`;
  h += histCard();
  h += '<h2>Pick your drinks' + (S.last ? ' <span class="mut" style="font-weight:400">· your most ordered first</span>' : '') + '</h2><div class="grid">' + st.drinks.map(d => {
    const q = cart[d.name] || 0;
    return `<div class="card drink" style="margin:0"><b>${esc(d.name)}</b><span>${money(d.price)}</span><span class="mut">${d.left > 0 ? d.left + ' left' : 'Out of stock'}</span><div class="row"><button data-m="${esc(d.name)}" ${q <= 0 ? 'disabled' : ''}>−</button><b>${q}</b><button data-p="${esc(d.name)}" ${q >= d.left ? 'disabled' : ''}>+</button></div></div>`;
  }).join('') + '</div>';
  if (!st.drinks.length) h += '<p class="mut">No drinks yet. The admin needs to add some.</p>';
  const items = st.drinks.filter(d => cart[d.name] > 0);
  if (items.length) h += '<div class="card bill" style="margin-top:12px"><b>Your selection</b>' + items.map(d => `<div class="row"><span style="flex:1">${cart[d.name]} × ${esc(d.name)}</span><span>${money(cart[d.name] * d.price)}</span></div>`).join('') +
    `<div class="row"><b style="flex:1">Total</b><b>${money(items.reduce((a, d) => a + cart[d.name] * d.price, 0))}</b></div><div class="row"><button class="pri" id="submit">Submit</button><button id="clear">Clear</button></div><div class="mut">Nothing is recorded until you press Submit. Use − to fix a mistake.</div></div>`;
  h += remindCard();
  h += duePopup();
  $('buy').innerHTML = h;
  $('so').onclick = async () => { await tryRun('signOut', tok); tok = null; me = null; try { localStorage.removeItem('tok'); } catch (x) {} drawLogin(); };
  if ($('pay')) $('pay').onclick = () => { showPay = true; drawBuy(); };
  if ($('later')) $('later').onclick = () => { showPay = false; drawBuy(); };
  if ($('paid')) $('paid').onclick = async () => { const r = await safe(run('markPaid', tok)); if (r) { S = r; showPay = false; drawBuy(); flash('Thanks! The admin will confirm your payment.'); } };
  document.querySelectorAll('[data-p]').forEach(b => b.onclick = () => { cart[b.dataset.p] = (cart[b.dataset.p] || 0) + 1; drawBuy(); });
  document.querySelectorAll('[data-m]').forEach(b => b.onclick = () => { cart[b.dataset.m] = Math.max(0, (cart[b.dataset.m] || 0) - 1); if (!cart[b.dataset.m]) delete cart[b.dataset.m]; drawBuy(); });
  if ($('clear')) $('clear').onclick = () => { cart = {}; drawBuy(); };
  if ($('submit')) $('submit').onclick = async () => {
    $('submit').disabled = true;
    const r = await safe(run('logPurchases', tok, items.map(d => ({ drink: d.name, qty: cart[d.name] }))));
    if (r) { S = r; cart = {}; if (pay.on) showPay = true; drawBuy(); flash('Submitted. Thank you!'); } else loadBuy();
  };
  if ($('hist')) $('hist').onclick = async () => {
    if (hist && hist.user === S.name && hist.sig === sigOf()) { hist = null; drawBuy(); return; }
    const r = await safe(run('myHistory', tok));
    if (r) { hist = r; hist.user = S.name; hist.sig = sigOf(); drawBuy(); }
  };
  if ($('nt')) $('nt').onchange = async () => { const r = await safe(run('setNotify', tok, $('nt').value)); if (r) { S = r; flash('Saved'); } drawBuy(); };
  if ($('tgc')) $('tgc').onclick = async () => { const l = await safe(run('tgLink', tok)); if (l) { tgUrl = l.url; drawBuy(); pollTg(); } };
  if ($('tgd')) $('tgd').onclick = async () => { const r = await safe(run('tgDisconnect', tok)); if (r) { S = r; drawBuy(); flash('Telegram disconnected'); } };
  if ($('duebtn')) $('duebtn').onclick = () => { dueDismissed = false; drawBuy(); };
  if ($('duelater')) $('duelater').onclick = () => { dueDismissed = true; drawBuy(); };
  if ($('duepaid')) $('duepaid').onclick = async () => { const r = await safe(run('markPaid', tok, 'prev')); if (r) { S = r; drawBuy(); flash('Thanks! The admin will confirm your payment.'); } };
  if ($('undo')) $('undo').onclick = async () => { const r = await safe(run('undoLast', tok)); if (r) { S = r; showPay = false; drawBuy(); flash('Last submission removed'); } else loadBuy(); };
}

function payCard(a) {
  const p = a.pay;
  return `<h2>Payment details</h2><div class="card"><div class="row"><input id="pyn" placeholder="Payee name" value="${esc(p.name)}" style="flex:1"></div><div class="row"><input id="pyu" placeholder="Number (phone or account)" value="${esc(p.number)}" style="flex:1"></div><div class="row"><input id="pyx" placeholder="Extra note (optional)" value="${esc(p.note)}" style="flex:1"></div><div class="row"><button class="pri" id="paysave">Save</button></div><div class="mut">Shown in the payment pop-up and in reminders. Leave all three blank to use the default text in the code.</div></div>`;
}
function tgAdminCard(a) {
  let h = '<h2>Telegram</h2><div class="card">';
  if (!a.tgBot) h += '<div class="mut">Create a bot with @BotFather on Telegram, then paste its token here.</div><div class="row"><input id="tgtok" type="password" placeholder="Bot token" style="flex:1"><button class="pri" id="tgsave">Connect bot</button></div>';
  else {
    h += `<div class="row"><span style="flex:1">Bot: <b>@${esc(a.tgBot)}</b></span><button id="tgrm">Remove bot</button></div><div class="mut">${a.adminTg} admin chat(s) connected for alerts</div>` +
      (atgUrl ? `<p><a href="${esc(atgUrl)}" target="_blank" rel="noopener">Open Telegram and press Start</a> <span class="mut">(waiting…)</span></p>` :
        '<div class="row"><button class="pri" id="atgc">Connect my Telegram for alerts</button>' + (a.adminTg > 0 ? '<button id="atgx">Clear</button>' : '') + '</div>');
  }
  return h + '</div>';
}
async function pollAdminTg(before) {
  for (let i = 0; i < 40 && atgUrl && pin; i++) {
    await new Promise(r => setTimeout(r, 3000));
    const r = await safe(run('adminTgCheck', pin));
    if (r && r.n > before) { atgUrl = null; adminLoad(); flash('Telegram connected for alerts'); return; }
  }
  atgUrl = null; if (pin) adminLoad();
}
async function adminLoad() {
  if (!pin) { pin = prompt('Admin PIN'); if (!pin) { showTab('buy'); return; } }
  const r = await safe(run('adminState', pin, month));
  if (!r) { pin = null; showTab('buy'); return; }
  drawAdmin(r);
}
function dashCard(a) {
  const d = a.dash, mx = Math.max(1, ...d.trend.map(t => t.total)), diff = d.sales - d.prevSales;
  let h = `<h2>Dashboard · ${month}</h2><div class="card"><div class="row"><div style="flex:1"><div class="mut">Sales</div><div class="big">${money(d.sales)}</div><div class="mut">${d.count} drink(s) · ${diff >= 0 ? '+' : '−'}${money(Math.abs(diff))} vs last month</div></div><div style="flex:1"><div class="mut">Unpaid (all months)</div><div class="big ${d.owedTotal > 0.005 ? 'warn' : ''}">${money(d.owedTotal)}</div></div></div>`;
  h += '<div class="mut" style="margin-top:8px">Last 6 months</div>' + d.trend.map(t => `<div class="row" style="flex-wrap:nowrap"><span class="mut" style="width:64px">${t.m}</span><div style="flex:1"><div style="background:var(--ac);height:10px;border-radius:5px;min-width:2px;width:${Math.round(t.total / mx * 100)}%"></div></div><span class="mut">${money(t.total)}</span></div>`).join('');
  h += '<div class="mut" style="margin-top:8px">Top drinks this month</div>' + (d.top.length ? d.top.map(t => `<div class="row"><span style="flex:1">${esc(t.name)}</span><span>${t.qty} · ${money(t.total)}</span></div>`).join('') : '<div class="mut">No sales yet</div>');
  h += '<div class="mut" style="margin-top:8px">Who owes the most</div>' + (d.owes.length ? d.owes.map(t => `<div class="row"><span style="flex:1">${esc(t.name)}</span><span class="warn">${money(t.total)}</span></div>`).join('') : '<div class="mut">Everyone is settled</div>');
  return h + '</div>';
}
function drawAdmin(a) {
  const lowList = a.drinks.filter(d => d.active && d.left <= a.low);
  let h = dashCard(a) + (lowList.length ? '<div class="card bill"><b class="warn">Low stock</b><div>' + lowList.map(d => esc(d.name) + (d.left <= 0 ? ' (out)' : ' (' + d.left + ' left)')).join(', ') + '</div></div>' : '') + '<h2>Stock</h2><div class="card scroll"><table><tr><th>Drink</th><th class="n">Price</th><th class="n">Topped up</th><th class="n">Sold</th><th class="n">Left</th><th>Top up</th><th></th></tr>' +
    a.drinks.map((d, i) => `<tr><td>${esc(d.name)}${d.active ? '' : ' <span class="mut">(retired)</span>'}</td><td class="n"><input id="pr${i}" type="number" step="0.05" min="0" value="${d.price}" style="width:75px"> <button data-pr="${i}">Set</button></td><td class="n">${d.topped}</td><td class="n">${d.sold}</td><td class="n ${d.left <= a.low ? 'warn' : ''}">${d.left}</td><td><input id="tu${i}" type="number" min="1" style="width:70px"> <button data-tu="${i}">Add</button></td><td><button data-rn="${i}">Rename</button> <button data-rt="${i}">${d.active ? 'Retire' : 'Restore'}</button></td></tr>`).join('') + '</table></div>' +
    '<h2>Add a drink</h2><div class="card"><div class="row"><input id="dn" placeholder="Name (e.g. Coke)"><input id="dp" type="number" step="0.05" min="0" placeholder="Price" style="width:90px"><input id="dq" type="number" min="0" placeholder="Qty" style="width:80px"><button class="pri" id="addD">Add</button></div></div>' +
    '<h2>Add a user</h2><div class="card"><div class="row"><input id="un" placeholder="Name"><input id="ue" type="email" placeholder="Email (required)"><button class="pri" id="addU">Add</button></div><div class="mut">' + a.users.map((u, i) => `<div class="row"><span style="flex:1">${esc(u.name)} ${u.email ? `<span class="mut">${esc(u.email)}</span>` : `<input id="ue${i}" type="email" placeholder="Add email" style="width:180px"> <button data-se="${i}">Set</button>`}</span><button data-rp="${i}">Reset PIN</button> <button data-ru="${i}">Remove</button></div>`).join('') + '</div></div>' +
    '<h2>Billing</h2><div class="row"><label>Month</label><input type="month" id="mo" value="' + month + '"></div><div class="card scroll"><table><tr><th>User</th><th class="n">Drinks</th><th class="n">Total</th><th class="n">Unpaid</th><th class="n">Reported</th><th class="n">Paid</th><th class="n">All months owed</th><th></th></tr>' +
    a.summary.map((u, i) => `<tr><td>${esc(u.name)}</td><td class="n">${u.count}</td><td class="n">${money(u.total)}</td><td class="n ${u.owed > 0 ? 'warn' : ''}">${money(u.owed)}</td><td class="n">${money(u.pending)}</td><td class="n">${money(u.paid)}</td><td class="n ${u.allOwed > 0.005 ? 'warn' : ''}">${money(u.allOwed)}</td><td>${(u.owed + u.pending) > 0 ? `<button data-cp="${i}">Mark month paid</button>` : ''} ${u.allOwed > 0.005 ? `<button data-ca="${i}">Mark all paid</button>` : ''}</td></tr>`).join('') +
    `<tr><th>All</th><th class="n">${a.summary.reduce((x, u) => x + u.count, 0)}</th><th class="n">${money(a.summary.reduce((x, u) => x + u.total, 0))}</th><th class="n">${money(a.summary.reduce((x, u) => x + u.owed, 0))}</th><th class="n">${money(a.summary.reduce((x, u) => x + u.pending, 0))}</th><th class="n">${money(a.summary.reduce((x, u) => x + u.paid, 0))}</th><th class="n">${money(a.summary.reduce((x, u) => x + u.allOwed, 0))}</th><th></th></tr></table></div>` +
    '<div class="row"><button class="pri" id="sum">Create summary sheet</button><button id="snd">Email reminders now</button></div>' +
    '<p class="mut">Reminders also go out automatically on the last day of each month.</p>' +
    '<h2>Alert emails</h2><div class="card"><div class="row"><input id="ae" style="flex:1" placeholder="a@example.com, b@example.com (blank = script owner)" value="' + esc(a.alertEmails) + '"><button class="pri" id="saveAE">Save</button></div><div class="mut">Low-stock alerts and the month-end summary go to these addresses.</div></div>' + payCard(a) + tgAdminCard(a);
  $('adm').innerHTML = h;
  const done = async (p, m) => { await safe(p); const err = safe.err; if (!err && m) flash(m); await adminLoad(); if (err) flash(err.replace(/^Error:\s*/, ''), 10000); };
  document.querySelectorAll('[data-tu]').forEach(b => b.onclick = () => done(run('topUp', pin, a.drinks[b.dataset.tu].name, $('tu' + b.dataset.tu).value), 'Stock updated'));
  document.querySelectorAll('[data-pr]').forEach(b => b.onclick = () => done(run('setPrice', pin, a.drinks[b.dataset.pr].name, parseFloat($('pr' + b.dataset.pr).value)), 'Price updated (applies to new purchases)'));
  document.querySelectorAll('[data-ru]').forEach(b => b.onclick = () => { const u = a.users[b.dataset.ru]; if (confirm('Remove ' + u.name + '? Past purchases stay on record.')) done(run('removeUser', pin, u.name), 'User removed'); });
  document.querySelectorAll('[data-ca]').forEach(b => b.onclick = () => { const u = a.summary[b.dataset.ca]; if (confirm('Mark everything ' + u.name + ' owes (all months) as paid?')) done(run('confirmAllPaid', pin, u.name), 'Marked as paid'); });
  document.querySelectorAll('[data-rn]').forEach(b => b.onclick = () => { const d = a.drinks[b.dataset.rn], n = prompt('New name for ' + d.name, d.name); if (n && n.trim() && n.trim() !== d.name) done(run('renameDrink', pin, d.name, n), 'Renamed'); });
  document.querySelectorAll('[data-rt]').forEach(b => b.onclick = () => { const d = a.drinks[b.dataset.rt]; if (!d.active || confirm('Retire ' + d.name + '? Users will no longer see it. History is kept and you can restore it later.')) done(run('setDrinkActive', pin, d.name, !d.active), d.active ? 'Drink retired' : 'Drink restored'); });
  document.querySelectorAll('[data-cp]').forEach(b => b.onclick = () => { const u = a.summary[b.dataset.cp]; if (confirm('Mark all of ' + u.name + "'s " + month + ' drinks as paid?')) done(run('confirmPaid', pin, u.name, month), 'Marked as paid'); });
  document.querySelectorAll('[data-se]').forEach(b => b.onclick = () => done(run('setEmail', pin, a.users[b.dataset.se].name, $('ue' + b.dataset.se).value), 'Email saved'));
  document.querySelectorAll('[data-rp]').forEach(b => b.onclick = () => { const u = a.users[b.dataset.rp]; if (confirm('Reset the PIN for ' + u.name + '? They will choose a new one at next sign-in.')) done(run('resetPin', pin, u.name), 'PIN reset'); });
  if ($('paysave')) $('paysave').onclick = () => done(run('setPayment', pin, $('pyn').value, $('pyu').value, $('pyx').value), 'Payment details saved');
  if ($('tgsave')) $('tgsave').onclick = () => done(run('setTelegram', pin, $('tgtok').value), 'Telegram bot connected');
  if ($('tgrm')) $('tgrm').onclick = () => { if (confirm('Remove the Telegram bot? Users will fall back to email.')) done(run('setTelegram', pin, ''), 'Telegram bot removed'); };
  if ($('atgc')) $('atgc').onclick = async () => { const l = await safe(run('adminTgLink', pin)); if (l) { atgUrl = l.url; drawAdmin(a); pollAdminTg(a.adminTg); } };
  if ($('atgx')) $('atgx').onclick = () => done(run('adminTgClear', pin), 'Admin Telegram cleared');
  $('saveAE').onclick = () => done(run('setAdminEmails', pin, $('ae').value), 'Alert emails saved');
  $('addD').onclick = () => done(run('addDrink', pin, $('dn').value, parseFloat($('dp').value), $('dq').value), 'Drink added');
  $('addU').onclick = () => done(run('addUser', pin, $('un').value, $('ue').value), 'User added');
  $('mo').onchange = e => { if (e.target.value) { month = e.target.value; adminLoad(); } };
  $('sum').onclick = async () => { const u = await safe(run('createSummary', pin, month)); if (u) window.open(u, '_blank'); };
  $('snd').onclick = async () => { if (!confirm('Email everyone who has an unpaid or unconfirmed balance?')) return; const n = await safe(run('sendReminders', pin, month)); if (n !== undefined) flash('Sent ' + n + ' reminder(s)'); };
}
loadBuy();
</script></body></html>
